services:
  clinic-appointments:
    build: .
    ports:
      - "8000:8000"
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      DATABASE: /data/appointments.db
    volumes:
      - appointments-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=2)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  appointments-data:
